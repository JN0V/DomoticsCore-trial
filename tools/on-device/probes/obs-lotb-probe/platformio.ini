; OBS Lot B board probe: a System with console, Storage, SystemInfo and MQTT
; (Lot D: the raw telemetry and crash topics against DC_MQTT_BROKER) joined
; to the LAN from the repository's secrets.h, the crash commands compiled in,
; and a stopwatch around System::loop(). Build with and without
; -DDOMOTICS_FLIGHT_RECORDER_TICK=0 (PLATFORMIO_BUILD_FLAGS) for the
; sampler's cost; drive `crash <kind>` with tools/on-device/console_cmd.py.
; The nodemcuv2 needs this rather than FullStack, which never joins a
; network on an ESP8266 (CI-14).
[env]
framework = arduino
lib_archive = false
lib_ldf_mode = chain
monitor_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=3 -I../../../.. -DDOMOTICS_ENABLE_CRASH_COMMANDS=1
lib_deps =
    symlink://../../../../DomoticsCore-Core
    symlink://../../../../DomoticsCore-LED
    symlink://../../../../DomoticsCore-RemoteConsole
    symlink://../../../../DomoticsCore-Wifi
    symlink://../../../../DomoticsCore-System
    symlink://../../../../DomoticsCore-Storage
    symlink://../../../../DomoticsCore-SystemInfo
    symlink://../../../../DomoticsCore-MQTT
    bblanchon/ArduinoJson@^7.0.4
    knolleary/PubSubClient@^2.8

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
board_build.filesystem = littlefs
upload_port = /dev/ttyUSB1
build_flags = ${env.build_flags} -std=gnu++17
build_unflags = -std=gnu++11

; OBS-4: the ESP8266 diagnostic profile. DEBUG_ESP_OOM makes the C-path
; failures (String, JSON, lwIP) visible to the recorder's latch; -g gives
; addr2line file:line (costs measured in the roadmap's OBS-4 entry).
[env:nodemcuv2-diag]
extends = env:nodemcuv2
build_flags = ${env:nodemcuv2.build_flags} -DDEBUG_ESP_OOM -g -DDOMOTICS_BUILD_ID=\"diag\"

[env:esp32dev]
platform = espressif32@7.1.3
board = esp32dev
upload_port = /dev/ttyUSB0
build_flags = ${env.build_flags} -std=gnu++14
build_unflags = -std=gnu++11
