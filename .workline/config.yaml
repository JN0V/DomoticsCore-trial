roles:
  committer:
    settings:
      # The role's list (a project's list replaces it), plus the chips this
      # library targets: ESP32 and ESP8266 are names, not internal codes.
      internal-codes-allow: [UTF-8, UTF-16, UTF8, UTF16, SHA-1, SHA-256, SHA-512, SHA1, SHA256, SHA512, ISO-8601, 'RFC-[0-9]+', 'CVE-[0-9]+',
        'IPv[46]', x86, x64, arm64, amd64, win32, win64, 'H26[45]', 'MP[34]', 'HTTP[23]', OAuth2, 'ES20[0-9]{2}', 'v[0-9]+', 'Go1[0-9]+',
        'ESP32', 'ESP8266']
  documentalist:
    settings:
      # Catching up a backlog of docs, nightly: few pull requests waiting at a
      # time, few docs per call, so the subscription's limits hold.
      max-open-merge-requests: 3
      ai-max-calls: 5
      # Docs whose sources do not fit one call are judged in parts, a share
      # of their sources at a time (workline ADR-0009; the default since
      # workline v0.28.0): fixed, but `checked` stays for a person, who reads
      # them whole. One doc in parts a night: at most 8 parts.
      parts-max-per-run: 8
      # A safety net on the tokens a night spends, all calls together. Past
      # it the rest waits; a doc whose parts it cuts is asked again later.
      ai-max-tokens: 400000
      # The weekly sample (workline ADR-0015): the gardening vouches with
      # Sonnet, so Opus reads. Nothing vouched for before the merge of #119,
      # the first engine on main that earns `checked` (v0.2.1), is sampled.
      sample: {judge: "claude:opus", after: ab2876ae9f5c20fa1128aae15e16f36c1bc3d118}
  tester:
    settings:
      # Each component is a PlatformIO project with native Unity suites in
      # test/test_*/; tools/workline-tests.sh runs them and merges their
      # reports, its classname <component>/<suite>, its files from the root.
      test-command: tools/workline-tests.sh {report}
      # A new test is a new suite folder: a suite is one program, so a
      # second file beside an existing one would define main() twice.
      test-paths: ["DomoticsCore-*/test/**", "DomoticsCore-WebUI/webui_test/**"]
      # g++'s error lines, rewritten from the root by the script: a test
      # written before its code names what the code lacks.
      build-errors:
        - error: '^(?P<file>[^\s:]+\.(?:cpp|cc|c|h|hpp)):\d+:\d+: error: (?P<message>.+)$'
          missing-name:
            # gcc quotes with ‘’ in a UTF-8 locale, with '' in C.
            - "^[‘'][\\w:]+[’'] was not declared in this scope"
            - "^[‘'][\\w:]+[’'] has not been declared"
            - "^[‘'][\\w:]+[’'] is not a member of [‘'][\\w:]+[’']"
            - "^[‘'](?:class|struct) [^’']+[’'] has no member named [‘']\\w+[’']"
          test-name: '(?m)^(?:static\s+)?void\s+(test_\w+)\s*\(\s*(?:void)?\s*\)'
  developer:
    settings:
      # Its proof on the components its code and the tests touch; the pull
      # request's CI runs every suite and every board build.
      proof-command: tools/workline-tests.sh {report} {packages}

routing:
  # Before a push, the committer checks the commits leaving the machine; the
  # documentalist only counts the docs they made suspect (ADR-0010). On a
  # pull request, the committer and the documentalist, the tester's guard on
  # its own branches, then the reviewer reads the code. Gardening at night:
  # the docs, then the backlog, then the specs it refined. The line of
  # states (workline ADR-0059), by events (workline-develop.yml): an issue
  # to refine wakes the product owner, then the reviewer reads its spec;
  # one waiting for its tests wakes the tester; ready wakes the developer.
  events: {pre-push: [committer, documentalist], merge-request: [committer, documentalist, tester, reviewer],
    schedule: [documentalist, product-owner, reviewer], issue: [product-owner, reviewer, tester, developer]}

# The forge merges what a person accepted (workline ADR-0042), and at
# `normal` a reproduced bug's fix once every check is green (ADR-0060).
merge: {autonomy: normal}
