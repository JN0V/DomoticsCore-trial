# What CI's native test job installs, for workline's tester and developer
# (workline-develop.yml runs it before the agent and the proof).
name: workline setup
description: PlatformIO, to run the native suites.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with: {python-version: '3.11'}
    - uses: actions/cache@v4
      with:
        path: ~/.platformio
        key: pio-native-6.1.19-${{ hashFiles('DomoticsCore-*/platformio.ini', 'DomoticsCore-*/test/*/platformio.ini') }}
        restore-keys: pio-native-
    - shell: bash
      run: pip install platformio==6.1.19
